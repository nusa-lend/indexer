# fly.toml app configuration file generated for nusa-lend-indexer on 2025-10-23T15:47:26+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nusa-lend-indexer'
primary_region = 'sin'

[build]

[deploy]
  strategy = 'immediate'

[http_service]
  internal_port = 42069
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
