# Fly.io configuration for nusa-lend-indexer
app = "nusa-lend-indexer"
primary_region = "sin"

[build]

[http_service]
  internal_port = 42069
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "10s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[deploy]
  strategy = "immediate"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048